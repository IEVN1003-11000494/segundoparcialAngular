<form class="max-w-2xl mx-auto p-6 mt-10">
  
  <h2 class="text-3xl font-bold text-gray-500 mb-8">Lista Alumnos</h2>

  <form [formGroup]="formulario">

  <!-- Matricula -->
  <div class="mb-5">
    <label for="matricula" class="block mb-2 text-sm font-bold text-gray-500">
      Matricula
    </label>
    <input
      type="text"
      id="matricula"
      name="matricula"
      required
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      placeholder="Matricula"
      formControlName="matricula"
    >
  </div>

  <!-- Nombre -->
  <div class="mb-5">
    <label for="nombre" class="block mb-2 text-sm font-bold text-gray-500">
      Nombre
    </label>
    <input
      type="text"
      id="nombre"
      name="nombre"
      required
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      placeholder="Nombre"
      formControlName="nombre"
    >
  </div>

  <!-- Correo -->
  <div class="mb-5">
    <label for="correo" class="block mb-2 text-sm font-bold text-gray-500">
      Correo
    </label>
    <input
      type="email"
      id="correo"
      name="correo"
      required
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      placeholder="Correo"
      formControlName="correo"
    >
  </div>

  <!-- Materia -->
  <div class="mb-8">
    <label for="materia" class="block mb-2 text-sm font-bold text-gray-500">
      Materia
    </label>
    <input
      type="text"
      id="materia"
      name="materia"
      required
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      placeholder="Materia"
      formControlName="materia"
    >
  </div>

  <!-- Botones -->
  <div class="flex justify-center gap-4">
    <button 
      type="submit"
      (click)="muestraAlumno()" 
      class="text-white bg-indigo-500 hover:bg-indigo-600 focus:ring-4 focus:ring-indigo-300 font-medium rounded-full text-sm px-6 py-2.5 focus:outline-none"
    >
      Registrar
    </button>
    <button 
      type="button" 
      class="text-white bg-indigo-500 hover:bg-indigo-600 focus:ring-4 focus:ring-indigo-300 font-medium rounded-full text-sm px-6 py-2.5 focus:outline-none"
    >
      Cargar
    </button>
  </div>

</form>

<h2 class="mb-4 text-2xl font-bold text-gray-900">
    Lista de alumnos
</h2>
<h3>Matricula:{{nuevoAlumno.matricula}}</h3>
<h3>Nombre: {{nuevoAlumno.nombre}}</h3>
<h3>Correo: {{nuevoAlumno.correo}}</h3>
<h3>Materia: {{nuevoAlumno.materia}}</h3>



    <!-- Tabla -->
<div class="max-w-6xl mx-auto mt-8">
