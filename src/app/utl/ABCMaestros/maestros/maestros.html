<div class="p-6 bg-white rounded-lg shadow-md">
    
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <button class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md flex items-center gap-2 shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Agregar
        </button>
        <h1 class="text-2xl font-semibold text-gray-800">Lista de Maestros</h1>
    </div>

    <div class="flex flex-col md:flex-row md:items-center gap-4 mb-6">
        <label class="text-gray-700 font-medium whitespace-nowrap">Filtrar por:</label>
        <div class="w-full">
            <input [(ngModel)]="listFilter" type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="Buscar maestro...">
        </div>
    </div>

    <div class="relative overflow-x-auto shadow-sm sm:rounded-lg border border-gray-200">
        <table class="w-full text-sm text-left text-gray-500">
            <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                <tr>
                    <th scope="col" class="px-6 py-4 font-bold">Id Maestro</th>
                    <th scope="col" class="px-6 py-4 font-bold">Nombre</th>
                    <th scope="col" class="px-6 py-4 font-bold">Apaterno</th>
                    <th scope="col" class="px-6 py-4 font-bold">Amaterno</th>
                    <th scope="col" class="px-6 py-4 font-bold">Correo</th>
                    <th scope="col" class="px-6 py-4 font-bold text-center">Editar</th>
                    <th scope="col" class="px-6 py-4 font-bold text-center">Eliminar</th>
                </tr>
            </thead>
            <tbody>
                <!-- Iteración limpia sin el Pipe de filtro -->
                <tr *ngFor="let maestro of dataSource" class="bg-white border-b hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4">{{maestro.idmaestro}}</td>
                    <td class="px-6 py-4">{{maestro.nombre | uppercase}}</td>
                    <td class="px-6 py-4">{{maestro.apaterno}}</td>
                    <td class="px-6 py-4">{{maestro.amaterno}}</td>
                    <td class="px-6 py-4">{{maestro.correo}}</td>
                    
                    <td class="px-6 py-4 text-center">
                        <button class="inline-flex items-center gap-1 bg-green-50 text-green-700 border border-green-500 hover:bg-green-100 font-medium rounded-full text-xs px-4 py-1.5 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            Editar
                        </button>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <button class="inline-flex items-center gap-1 bg-red-50 text-red-700 border border-red-500 hover:bg-red-100 font-medium rounded-full text-xs px-4 py-1.5 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div *ngIf="dataSource.length === 0" class="p-8 text-center text-gray-500">
            No hay maestros registrados en la base de datos...
        </div>
    </div>
</div>
